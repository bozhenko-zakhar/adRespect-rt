<section class="relative py-[72px] bg-primary desktop:py-[144.5px] desktop:bg-beige" id="hero">
	<!-- hero-section -->
	<div class="upper-container">
		<div
			class="z-1 absolute bottom-1/2 right-1/2 translate-x-1/2 w-[calc(100%_-_30px)] flex justify-between bg-transparent desktop:gap-8 desktop:bottom-0 desktop:right-0 desktop:translate-x-0 desktop:py-6 desktop:px-8 desktop:w-auto desktop:justify-start desktop:bg-cream">
			<!-- hero-image-buttons -->
			<button type="button" aria-label="Slide previous content"
				class="hero-image-button arrow-group animation-transition-default animation-hover-lift animation-active-press z-1 bg-primary/30 border-0 rounded-full w-[72px] h-[72px] flex justify-center items-center desktop:bg-transparent desktop:rounded-none desktop:w-auto desktop:h-auto cursor-pointer">
				<svg aria-label="hidden" class="animation-arrow-left z-1 fill-cream w-12 h-12 desktop:fill-primary">
					<!-- arrow-slide -->
					<use href="/icons/arrow-previous.svg"></use>
				</svg>
			</button>
			<button type="button" aria-label="Slide next content"
				class="hero-image-button arrow-group animation-transition-default animation-hover-lift animation-active-press z-1 bg-primary/30 border-0 rounded-full w-[72px] h-[72px] flex justify-center items-center desktop:bg-transparent desktop:rounded-none desktop:w-auto desktop:h-auto cursor-pointer">
				<svg aria-label="hidden" class="animation-arrow-right z-1 fill-cream w-12 h-12 desktop:fill-primary">
					<!-- arrow-slide -->
					<use href="/icons/arrow-next.svg"></use>
				</svg>
			</button>
		</div>

		<div
			class="hero-image image-0 absolute top-0 right-0 w-full h-full bg-center bg-no-repeat bg-cover desktop:w-[calc(50%_-_32px)] after:content-[''] after:absolute after:inset-0 after:bg-primary/40 after:pointer-events-none desktop:after:bg-transparent">
		</div>

		<div class="hero-content relative desktop:w-[599px]"> <!-- hero-content -->
			<h1
				class="hero-heading flex flex-col font-montserrat font-medium text-4xl leading-[1.16667] text-cream mb-11 tablet:w-[497px] desktop:text-primary desktop:text-6xl">
				Nowoczesna aranżacja <span>Twojego ogrodu</span></h1>
			<p
				class="hero-info font-inter font-normal text-sm leading-normal text-cream mb-[72px] tablet:w-[438px] desktop:text-primary desktop:text-base">
				Marka GiardDesign to wieloletnie doświadczenie i wysoka estetyka realizacji. Oferujemy
				kompleksowy zakres usług z indywidualnym podejściem do każdego projektu.</p>

			<ul class="flex flex-col gap-9 tablet:flex-row"> <!-- hero-list -->
				<li
					class="animation-transition-default animation-hover-lift animation-active-press flex justify-center items-center bg-green rounded-full h-[50px] cursor-pointer tablet:w-[208px]">
					<!-- hero-item-1 -->
					<a class="font-inter font-normal text-sm leading-normal text-center text-cream no-underline desktop:text-base"
						href="#instagram">Skontaktuj się z nami</a> <!-- hero-link-1 -->
				</li>
				<li
					class="animation-transition-default animation-hover-lift animation-active-press flex justify-center items-center border-0 rounded-full h-[50px] cursor-pointer bg-cream tablet:w-[249px] desktop:border desktop:border-green desktop:bg-transparent">
					<!-- hero-item-2 -->
					<a class="arrow-group flex items-center gap-2 font-inter font-normal text-sm leading-normal text-center text-green text-nowrap no-underline  desktop:text-base"
						href="#projects"> <!-- hero-link-2 -->
						Zobacz nasze realizacje
						<svg aria-label="hidden" class="animation-arrow-down fill-current w-4 h-4"> <!-- hero-details-icon -->
							<use href="/icons/arrow-down.svg"></use>
						</svg>
					</a>
				</li>
			</ul>
		</div>
	</div>
</section>
