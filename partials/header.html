							<use href="/icons/search.svg"></use>
						</svg>

						<span class="search-cross block">
							<span
								class="search-cross-1 h-[1.5px] w-full bg-transparent rounded-[25px] absolute top-1/2 left-1/2 -translate-1/2 rotate-45 transition-[background] duration-300 ease-out"></span>
